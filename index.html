<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFE4EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rocío">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Rocío Ritual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
html{-webkit-text-size-adjust:100%;color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: app móvil de una columna; cabecera-hábitat con la mascota, contenido en tarjetas redondeadas, navegación inferior de 5 pestañas. Estilo kawaii pastel propio. */
:root{
  --bg:#FFF6FA; --surface:#FFFFFF; --surface-2:#FDEEF5; --ink:#4B3A5A; --muted:#8C7D9E; --line:#F1DDE9;
  --accent:#FF6FA3; --accent-ink:#FFFFFF;
  --pink:#FFD6E6; --lav:#E7DEFF; --mint:#D3F3E5; --peach:#FFE4D1; --sky:#D7ECFF; --butter:#FFF2BF;
  --sun:#EE9B2F; --night:#7A6CD8; --leaf:#38A97E; --drop:#A9DDF1; --drop-deep:#3F9FC3;
  --shadow:0 8px 24px rgba(214,98,150,.12);
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E1828; --surface:#2A2236; --surface-2:#342A41; --ink:#F7EDF8; --muted:#B9A9C8; --line:#463A53;
  --accent:#FF8DB9; --accent-ink:#2B0F1D;
  --pink:#5B3249; --lav:#3F3564; --mint:#24493D; --peach:#55392A; --sky:#253F56; --butter:#4D4428;
  --sun:#F7C06A; --night:#AFA3FF; --leaf:#72D6AB; --drop:#86CBE3; --drop-deep:#66C0DF;
  --shadow:0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E1828; --surface:#2A2236; --surface-2:#342A41; --ink:#F7EDF8; --muted:#B9A9C8; --line:#463A53;
  --accent:#FF8DB9; --accent-ink:#2B0F1D;
  --pink:#5B3249; --lav:#3F3564; --mint:#24493D; --peach:#55392A; --sky:#253F56; --butter:#4D4428;
  --sun:#F7C06A; --night:#AFA3FF; --leaf:#72D6AB; --drop:#86CBE3; --drop-deep:#66C0DF;
  --shadow:0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(circle at 12% 8%,var(--pink) 0 60px,transparent 61px),radial-gradient(circle at 92% 18%,var(--lav) 0 80px,transparent 81px),radial-gradient(circle at 80% 92%,var(--mint) 0 70px,transparent 71px);
  background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px calc(104px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1;font-weight:600}
h2{font-size:1.32rem} h3{font-size:1.05rem}
p{margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.muted{color:var(--muted)} .small{font-size:.86rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.card{background:var(--surface);border-radius:26px;padding:18px;display:grid;gap:12px;box-shadow:var(--shadow)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tint-pink{background:var(--pink)} .tint-lav{background:var(--lav)} .tint-mint{background:var(--mint)} .tint-peach{background:var(--peach)} .tint-sky{background:var(--sky)} .tint-butter{background:var(--butter)}

.btn{border:0;border-radius:999px;padding:12px 20px;min-height:48px;font-family:var(--display);font-weight:600;font-size:1.05rem;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 rgba(120,30,70,.18);transition:transform .1s}
.btn:active{transform:translateY(2px)}
.btn.soft{background:var(--surface-2);color:var(--ink);box-shadow:none;font-family:var(--body);font-weight:700;font-size:.95rem}
.btn.sm{min-height:40px;padding:8px 14px;font-size:.92rem}
.btn[disabled]{opacity:.45;cursor:default}
.link-btn{background:none;border:0;padding:6px 4px;color:var(--muted);font-size:.86rem;font-weight:800;text-decoration:underline;text-underline-offset:3px}
.icon-btn{border:0;background:var(--surface-2);border-radius:14px;width:40px;height:40px;flex:none;display:grid;place-items:center;font-weight:800}

.habitat{position:relative;border-radius:32px;padding:16px;display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;background:linear-gradient(170deg,var(--sky) 0%,var(--lav) 55%,var(--pink) 100%);box-shadow:var(--shadow);overflow:hidden}
.habitat::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-38px;height:70px;border-radius:50%;background:var(--mint);opacity:.85}
.habitat > *{position:relative;z-index:1}
.pet-tap{background:none;border:0;padding:0;width:120px;height:120px;position:relative}
.pet{width:100%;height:100%;overflow:visible}
.bubble{background:var(--surface);border-radius:20px 20px 20px 6px;padding:10px 12px;font-size:.94rem;line-height:1.35;box-shadow:0 2px 0 var(--line)}
.stage-tag{display:inline-flex;gap:6px;align-items:center;font-size:.78rem;font-weight:800;background:var(--surface);border-radius:999px;padding:3px 10px;margin-bottom:6px}
.streak-pill{display:inline-flex;gap:4px;align-items:center;font-size:.78rem;font-weight:800;background:var(--butter);color:var(--ink);border-radius:999px;padding:3px 10px;margin:0 0 6px 4px}
.streak-pill svg{width:14px;height:14px}
.needs{grid-column:1 / -1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:2px}
.need{background:var(--surface);opacity:.92;border-radius:16px;padding:8px 10px;display:grid;gap:4px;font-size:.76rem;font-weight:800}
.need .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.need .bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.meter{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.meter i{width:16px;height:20px;display:block;background:var(--surface);clip-path:path("M8 0 C8 0 0 10 0 14 a8 6 0 0 0 16 0 C16 10 8 0 8 0Z")}
.meter i.on{background:var(--drop-deep)}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.meter i.pop{animation:pop .45s ease-out}
.meter-label{font-weight:800;font-size:.82rem;margin-top:3px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes squish{0%{transform:scale(1,1)}40%{transform:scale(1.12,.88)}70%{transform:scale(.95,1.06)}100%{transform:scale(1,1)}}
.pet .body-g{animation:bob 3.4s ease-in-out infinite;transform-origin:60px 112px}
.pet-tap.squish .body-g{animation:squish .5s ease-out}
.heart{position:absolute;left:50%;top:30%;font-size:18px;color:var(--accent);pointer-events:none;animation:float 1.2s ease-out forwards}
@keyframes float{0%{opacity:1;transform:translate(-50%,0) scale(.6)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-60px) scale(1.2)}}

.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mood{display:grid;gap:4px;justify-items:center;padding:10px 2px;min-height:86px;border-radius:20px;border:0;background:var(--surface-2);font-size:.78rem;font-weight:800}
.mood svg{width:40px;height:40px}

.segs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;scroll-margin-top:12px}
.seg{display:grid;justify-items:center;gap:2px;padding:12px 6px 10px;background:var(--surface);border:3px solid transparent;border-radius:22px;box-shadow:var(--shadow)}
.seg[aria-pressed="true"]{border-color:var(--accent)}
.ring{width:44px;height:44px;margin-bottom:2px}
.seg-t{font-family:var(--display);font-weight:600;font-size:1rem;line-height:1}
.seg-n{font-size:.78rem;color:var(--muted);font-weight:800;text-align:center}

.steps{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.step{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;text-align:left;background:var(--surface-2);border:0;border-radius:18px;padding:10px 14px;transition:background .2s,transform .1s}
.step:active{transform:scale(.98)}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:800;background:var(--surface);color:var(--muted);flex:none}
.step .lbl{flex:1;min-width:0}
.step .box{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);flex:none;display:grid;place-items:center;background:var(--surface);transition:all .2s}
.step.done{background:var(--mint)}
.step.done .box{background:var(--leaf);border-color:var(--leaf)}
.step.done .box::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}
.panel-title{display:flex;align-items:center;gap:8px}
.panel-title .dot{width:14px;height:14px;border-radius:50%}
.done-note{font-weight:800;color:var(--leaf);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;background:var(--surface-2);border-radius:999px;padding:8px 14px;min-height:38px;font-size:.88rem;font-weight:700}
.chip.on{background:var(--lav);box-shadow:inset 0 0 0 2px var(--night)}
.sub-sec{display:grid;gap:8px;padding-top:12px;border-top:2px dashed var(--line)}

.meal{display:grid;gap:6px}
.meal-top{display:flex;gap:6px}
.meal-top .step{flex:1}
.meal-sum{display:block;font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{width:48px;flex:none;border:0;border-radius:18px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center}
.field{width:100%;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:11px 12px;font:inherit}
.water{display:flex;gap:6px;justify-content:space-between}
.glass{flex:1;max-width:42px;height:48px;border:3px solid var(--drop-deep);border-top-width:0;border-radius:0 0 12px 12px;background:transparent;position:relative;overflow:hidden;padding:0}
.glass::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:var(--drop);transition:height .35s}
.glass.on::after{height:80%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > .grow{flex:1;min-width:0}

.remind{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border-radius:22px;padding:12px 14px;box-shadow:var(--shadow);border-left:8px solid var(--drop-deep)}
.remind.sun{border-left-color:var(--sun)} .remind.night{border-left-color:var(--night)}
.remind-acts{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}

.trip{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.trip-ico{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;background:var(--surface)}
.trip-ico svg{width:60%;height:60%}
.progress{height:12px;border-radius:99px;background:var(--surface);overflow:hidden}
.progress i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s}

.stage-hero{display:grid;justify-items:center;gap:6px;text-align:center}
.stage-hero .pet-tap{width:190px;height:190px}
.evo{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.evo-i{display:grid;justify-items:center;gap:2px;text-align:center;font-size:.68rem;font-weight:800;color:var(--muted);min-width:0}
.evo-i svg{width:52px;height:52px}
.evo-i.cur{color:var(--accent)}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.disc{border:0;text-align:left;border-radius:20px;padding:12px;display:grid;gap:4px;align-content:start;min-height:96px;color:var(--ink)}
.disc.locked{background:var(--surface-2);color:var(--muted)}
.disc b{font-family:var(--display);font-weight:600;font-size:1rem;line-height:1.15}
.cat{font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}

.big-streak{display:flex;align-items:center;gap:14px}
.flame{width:64px;height:64px;flex:none}
.big-streak .n{font-family:var(--display);font-size:2.4rem;font-weight:700;line-height:1}
.streaks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.st{background:var(--surface-2);border-radius:18px;padding:10px 12px;display:grid;gap:2px}
.st b{font-family:var(--display);font-size:1.4rem;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal span{aspect-ratio:1;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:.7rem;font-weight:800;color:var(--muted);max-width:100%}
.cal span.l1{background:var(--pink)} .cal span.l2{background:var(--lav);color:var(--ink)} .cal span.l3{background:var(--accent);color:var(--accent-ink)}
.cal span.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal span.fut{opacity:.35}
.cal .wd{background:none;aspect-ratio:auto}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.album button{border:0;padding:0;border-radius:16px;overflow:hidden;aspect-ratio:1;background:var(--surface-2);position:relative;max-width:100%}
.album img{width:100%;height:100%;object-fit:cover;display:block}
.album .d{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.45);color:#fff;font-size:.68rem;font-weight:800;border-radius:8px;padding:1px 6px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.compare figure{margin:0;display:grid;gap:4px;text-align:center;font-size:.8rem;font-weight:800;min-width:0}
.compare img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:18px}

.prio{display:flex;gap:6px;align-items:center}
.focus{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.clock{font-family:var(--display);font-size:2.2rem;font-weight:700;line-height:1}
.goal{background:var(--surface-2);border-radius:20px;padding:12px;display:grid;gap:8px}
.goal-head{display:flex;gap:8px;align-items:center}
.goal-head b{flex:1;min-width:0;font-family:var(--display);font-weight:600;font-size:1.05rem}
.badge{display:inline-flex;align-items:center;gap:4px;background:var(--butter);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:800}
.ms{display:flex;gap:8px;align-items:center;border:0;background:var(--surface);border-radius:14px;padding:8px 10px;min-height:44px;text-align:left;width:100%}
.ms .box{width:22px;height:22px;border-radius:7px;border:3px solid var(--line);flex:none}
.ms.done .box{background:var(--leaf);border-color:var(--leaf)}
.ms.done span:last-child{color:var(--muted);text-decoration:line-through}

.edit-row{display:flex;gap:6px;align-items:center}
.edit-row .field{flex:1;min-width:0;padding:9px 12px}
.rem-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rem-row.sub{justify-content:flex-start;padding-left:54px;font-size:.88rem;color:var(--muted)}
.rem-row input[type=time],.rem-row select{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:6px 8px;font:inherit}
.switch{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;font-weight:700}
.switch .knob{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch[aria-checked="true"] .knob{background:var(--leaf)}
.switch[aria-checked="true"] .knob::after{transform:translateX(18px)}

nav.tabs{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;background:var(--surface);border-radius:26px;box-shadow:0 10px 30px rgba(120,60,110,.18);display:grid;grid-template-columns:repeat(5,1fr);padding:6px;z-index:5}
nav.tabs button{background:none;border:0;border-radius:20px;padding:6px 0;display:grid;justify-items:center;gap:1px;font-size:.7rem;color:var(--muted);font-weight:800;min-height:54px;min-width:0}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--surface-2)}

.modal{position:fixed;inset:0;background:rgba(40,20,50,.45);display:grid;place-items:end center;z-index:20;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--surface);border-radius:30px;padding:20px;width:100%;max-width:520px;max-height:88vh;overflow:auto;display:grid;gap:12px;animation:up .3s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet img{width:100%;border-radius:20px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:16px;font-size:.92rem;font-weight:700;max-width:calc(100% - 32px);z-index:30;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.foot{font-size:.76rem;color:var(--muted);text-align:center}
.anchor{border:0;background:var(--surface-2);border-radius:14px;padding:8px 12px;text-align:left;font-size:.88rem;color:var(--muted);justify-self:start}
.anchor b{color:var(--ink)}
.decor{display:inline-flex;gap:2px;vertical-align:middle;margin:0 0 6px 4px}
.decor svg{width:20px;height:20px}
.focus-pill{grid-column:1 / -1;justify-self:start;background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.8rem;font-weight:800}
.review,.traits,.tips{margin:0;padding-left:20px;display:grid;gap:6px}
.traits li.locked{color:var(--muted);font-style:italic}
.diary{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.diary li{display:grid;gap:2px;padding-bottom:8px;border-bottom:2px dashed var(--line)}
.metrics{display:grid;gap:6px}
.metrics div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 12px;background:var(--surface-2);border-radius:14px;font-size:.9rem}
.metrics b{flex:none}
.res{width:18px;height:22px;fill:var(--line);margin-right:4px}
.res.on{fill:var(--drop-deep)}
.field.when{margin:-2px 0 4px 46px;width:calc(100% - 46px);padding:8px 12px;font-size:.9rem}
.ob-list{display:grid;gap:8px}
@media (prefers-reduced-motion: reduce){.pet .body-g,.pet-tap.squish .body-g,.meter i.pop,.heart,.sheet{animation:none}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" aria-label="Secciones"></nav>
<div id="modal"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="cam" accept="image/*" capture="user" hidden>
<input type="file" id="gal" accept="image/*" hidden>
<input type="file" id="restore-file" accept="application/json,.json" hidden>

<script>
(function(){
"use strict";

/* ===== DATOS ===== */
const DEFAULT_STATE = {
  v:2, name:"Rocío", stage:null, found:[], trip:null, focusEnd:null,
  morning:[{id:"m1",t:"Limpiador suave"},{id:"m2",t:"Tónico"},{id:"m3",t:"Sérum de vitamina C"},{id:"m4",t:"Hidratante"},{id:"m5",t:"Protector solar"}],
  night:[{id:"n1",t:"Desmaquillar / doble limpieza"},{id:"n2",t:"Limpiador"},{id:"n3",t:"Tratamiento (sérum o activo)"},{id:"n4",t:"Contorno de ojos"},{id:"n5",t:"Hidratante de noche"}],
  meals:["Desayuno","Comida","Merienda","Cena"],
  reminders:{morning:{on:true,time:"08:00"},night:{on:true,time:"22:30"},water:{on:true,from:"10:00",to:"20:00",every:2}},
  goals:[], anchors:{morning:"",night:""}, onboarded:false, startDate:null, firsts:{}, flags:{}, weekFocus:null, breakEnd:null
};

let db=null, userId=null, mode="local";
const pending={}, writing={};
const ref=name=>db.doc("data/users/"+userId+"/"+name);
function persist(name,data){ LS.set(name,data); if(!db||!userId) return; clearTimeout(pending[name]); pending[name]=setTimeout(()=>flush(name,data),700); }
async function flush(name,data){
  if(writing[name]){ pending[name]=setTimeout(()=>flush(name,data),400); return; }
  writing[name]=true;
  try{ await ref(name).set(clone(data)); }catch(e){ if(e&&e.code==="quota_exceeded") toast("No queda espacio para guardar más datos."); }
  finally{ writing[name]=false; }
}

const IDB={ db:null,
  open(){ if(this.db) return Promise.resolve(this.db); return new Promise((res,rej)=>{ const r=indexedDB.open("rocio",1); r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains("meta")) d.createObjectStore("meta",{keyPath:"key"}); if(!d.objectStoreNames.contains("full")) d.createObjectStore("full"); }; r.onsuccess=()=>{ this.db=r.result; res(this.db); }; r.onerror=()=>rej(r.error); }); },
  async run(store,mode,fn){ const d=await this.open(); return new Promise((res,rej)=>{ const t=d.transaction(store,mode), q=fn(t.objectStore(store)); t.oncomplete=()=>res(q?q.result:undefined); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); },
  all(st){ return this.run(st,"readonly",o=>o.getAll()); },
  allKeys(st){ return this.run(st,"readonly",o=>o.getAllKeys()); },
  get(st,k){ return this.run(st,"readonly",o=>o.get(k)); },
  put(st,v,k){ return this.run(st,"readwrite",o=>k===undefined?o.put(v):o.put(v,k)); },
  del(st,k){ return this.run(st,"readwrite",o=>o.delete(k)); },
  clear(st){ return this.run(st,"readwrite",o=>o.clear()); }
};

const goalFor=mood=>mood==null?8:mood<=2?5:mood===3?8:10;

const inFirstWeek=k=>!!S.startDate&&daysBetween(S.startDate,k)>=0&&daysBetween(S.startDate,k)<7;

function energy(d){
  d=d||day();
  return S.morning.filter(s=>d.m[s.id]).length + S.night.filter(s=>d.n[s.id]).length
    + S.meals.filter(x=>d.meals[x]&&d.meals[x].done).length + Math.floor((d.water||0)/2)
    + (d.top||[]).filter(x=>x.done&&x.t).length + (d.focus||0) + (d.challenge&&d.challenge.done?2:0);
}
const mFull=d=>S.morning.length>0&&S.morning.every(s=>d.m[s.id]);
const nFull=d=>S.night.length>0&&S.night.every(s=>d.n[s.id]);
const OK={
  care:d=>mFull(d)||nFull(d), m:mFull, n:nFull,
  water:d=>(d.water||0)>=8, meals:d=>S.meals.length>0&&S.meals.every(x=>d.meals[x]&&d.meals[x].done),
  work:d=>(d.top||[]).some(x=>x.done&&x.t)||(d.focus||0)>0
};
function streak(type){
  const ok=k=>days["d-"+k]&&OK[type](days["d-"+k]);
  let k=todayKey(); if(!ok(k)) k=addDays(k,-1);
  let n=0; while(ok(k)){ n++; k=addDays(k,-1); }
  return n;
}
function bestStreak(type){
  const ks=Object.keys(days).map(k=>k.slice(2)).sort(); if(!ks.length) return 0;
  let best=0,cur=0,k=ks[0]; const end=todayKey();
  while(k<=end){ const d=days["d-"+k]; if(d&&OK[type](d)){ cur++; if(cur>best) best=cur; } else cur=0; k=addDays(k,1); }
  return best;
}
const mondayOf=k=>{ const [y,m,d]=k.split("-").map(Number); return addDays(k,-((new Date(y,m-1,d).getDay()+6)%7)); };
const isActive=d=>!!d&&(energy(d)>0||d.mood!=null);
const catComplete=c=>PLACES.filter(p=>p.cat===c).every(p=>S.found.some(f=>f.id===p.id));
function careInfo(){
  const tk=todayKey(), status={};
  const ks=Object.keys(days).filter(k=>isActive(days[k])).map(k=>k.slice(2)).sort();
  let reserve=0, run=0, best=0, okRun=0, lastMiss=null;
  if(ks.length){ let k=ks[0];
    while(k<=tk){
      const d=days["d-"+k];
      if(d&&OK.care(d)){ status[k]="ok"; run++; okRun++; if(okRun%7===0) reserve=Math.min(2,reserve+1); }
      else if(k===tk) status[k]="pending";
      else { const nx=days["d-"+addDays(k,1)];
        if(reserve>0){ reserve--; status[k]="protected"; run++; }
        else if(nx&&mFull(nx)&&nFull(nx)){ status[k]="repaired"; run++; }
        else { status[k]="miss"; if(run>0) lastMiss={date:k,lost:run}; run=0; okRun=0; } }
      if(run>best) best=run; k=addDays(k,1);
    } }
  const counts=w=>{ let n=0; for(let i=0;i<7;i++){ const x=status[addDays(w,i)]; if(x==="ok"||x==="protected"||x==="repaired") n++; } return n; };
  const cw=mondayOf(tk), cwCount=counts(cw), idx=daysBetween(cw,tk), remaining=status[tk]==="ok"?6-idx:7-idx, achievable=cwCount+remaining>=5;
  let weeks=0, w= cwCount>=5? cw : (achievable? addDays(cw,-7) : null);
  if(w&&!(cwCount>=5)) { /* semana en curso aún alcanzable: no rompe */ }
  if(w){ while(counts(w)>=5){ weeks++; w=addDays(w,-7); } }
  let bestWeeks=0, cur=0;
  if(ks.length){ let x=mondayOf(ks[0]); while(x<=cw){ if(counts(x)>=5){ cur++; if(cur>bestWeeks) bestWeeks=cur; } else if(x!==cw) cur=0; x=addDays(x,7); } }
  return {status,reserve,streak:run,best,lastMiss,weeks,bestWeeks:Math.max(bestWeeks,weeks),cwCount,achievable};
}
function starStep(){
  let best=null;
  [["m",S.morning],["n",S.night]].forEach(([k,arr])=>arr.forEach(s=>{
    const has=x=>{ const d=days["d-"+x]; return !!(d&&d[k]&&d[k][s.id]); };
    let x=todayKey(); if(!has(x)) x=addDays(x,-1);
    let n=0; while(has(x)){ n++; x=addDays(x,-1); }
    if(n>=3&&(!best||n>best.n)) best={t:s.t,n};
  }));
  return best;
}

function diaryLine(d){

  const w=d.water||0; if(w>=8) p.push("bebimos los 8 vasos de agua"); else if(w>0) p.push(`bebimos ${w} ${w===1?"vaso":"vasos"} de agua`);
  const f=S.meals.filter(x=>d.meals[x]&&d.meals[x].done).length; if(f) p.push(`registramos ${f} ${f===1?"comida":"comidas"}`);
  if(d.focus) p.push(`hicimos ${d.focus} ${d.focus===1?"bloque":"bloques"} de enfoque`);
  const fd=S.found.find(x=>x.date===d.date), pl=fd&&PLACES.find(z=>z.id===fd.id); if(pl) p.push(`volví de ${pl.place}`);

  const t=p.length>1? p.slice(0,-1).join(", ")+" y "+p.at(-1) : p[0];
  return t.charAt(0).toUpperCase()+t.slice(1)+".";
}

function xp(){
  let x=0;
  Object.values(days).forEach(d=>{ x+=Math.min(energy(d),goalOf(d)); if(OK.care(d)) x+=2; });
  x+=new Set(S.found.map(f=>f.id)).size*3;
  S.goals.forEach(g=>{ x+=(g.steps||[]).filter(s=>s.done).length*2; if(g.done) x+=5; });
  return x;
}

function needs(){
  const d=day(), tot=S.morning.length+S.night.length;
  return {
    sk: tot?(S.morning.filter(s=>d.m[s.id]).length+S.night.filter(s=>d.n[s.id]).length)/tot:0,
    fo: S.meals.length?S.meals.filter(x=>d.meals[x]&&d.meals[x].done).length/S.meals.length:0,
    wa: Math.min(1,(d.water||0)/8)
  };
}

  return (new Date().getHours()>=15&&avg<.2)?"sad":"happy";
}

function waterSlots(){ const w=S.reminders.water, a=toMin(w.from), b=toMin(w.to), step=Math.max(1,Number(w.every)||2)*60, out=[]; for(let t=a;t<=b;t+=step) out.push(t); return out; }

  if(S.trip) return "¡He vuelto! Tengo algo que contarte.";
  const gap=lastActiveGap();
  if(e===0&&gap!=null&&gap>=2) return "Te he echado de menos. ¿Empezamos con un vaso de agua?";
  if(d.mood==null) return y==="miss"?"Ayer descansamos. Hoy seguimos. ¿Cómo te sientes?":"¡Buenos días! ¿Cómo te sientes hoy?";
  if(y==="protected"&&e===0) return "Ayer usamos una gota de reserva y la racha sigue viva. Hoy seguimos.";
  if(d.adventured) return "Todo lo que hagas a partir de ahora también me hace crecer.";
  if(e>=g) return "¡Tengo energía de sobra! ¿Me dejas irme de aventura?";
  const st=starStep(); if(st&&e>0) return `¡Llevas ${st.n} días seguidos con «${st.t}»! Se nota.`;
  if(md==="sad") return "Tengo sed de cuidados. ¿Un vaso de agua juntas?";

function viewWork(){
  const d=day(); d.top=d.top||[];
  while(d.top.length<3) d.top.push({id:uid(),t:"",done:false});
  { const yc=(days["d-"+addDays(todayKey(),-1)]||{}).close; if(yc&&yc.next&&!d.seeded&&!d.top[0].t){ d.top[0].t=yc.next; d.seeded=true; saveDay(); } }
  const filled=d.top.filter(x=>x.t).length, doneTop=d.top.filter(x=>x.done&&x.t).length, sw=streak("work");
  let h=`<section class="card tint-lav"><div class="card-head"><div><div class="eyebrow">Misión de hoy</div><h2>Tus 3 prioridades</h2></div>${sw?`<span class="streak-pill">${FLAME}${sw} ${sw===1?"día":"días"}</span>`:""}</div><p class="small">Cada prioridad cumplida da 1 gota a ${esc(S.name)}.</p>`;
  d.top.forEach((x,i)=>{
    h+=`<div class="prio"><button class="icon-btn" data-act="topdone" data-v="${x.id}" aria-label="Marcar prioridad ${i+1}" aria-pressed="${!!x.done}" style="background:${x.done?"var(--leaf)":"var(--surface)"};color:${x.done?"#fff":"var(--muted)"}" ${x.t?"":"disabled"}>${x.done?"✓":i+1}</button><input class="field" type="text" id="top-${i}" data-top="${x.id}" value="${esc(x.t)}" placeholder="Prioridad ${i+1}" aria-label="Prioridad ${i+1}" style="${x.done?"text-decoration:line-through;color:var(--muted)":""}"></div>${x.t?`<input class="field when" type="text" id="topw-${i}" data-topwhen="${x.id}" value="${esc(x.when||"")}" placeholder="Cuándo: a las 10, después del café…" aria-label="Cuándo harás la prioridad ${i+1}">`:""}`;
  });
  h+=`<p class="small" style="font-weight:800">${doneTop} de ${filled||3} completadas</p></section>`;
  const running=S.focusEnd&&Date.now()<S.focusEnd;
  h+=`<section class="card tint-peach"><div class="focus"><div class="clock num" data-live="focus">${running?fmtClock(S.focusEnd-Date.now()):"25:00"}</div><div style="display:grid;gap:6px"><b>Bloque de enfoque</b><span class="small">${d.focus||0} hoy · cada bloque da 1 gota</span>${running?`<button class="btn soft sm" data-act="focusstop">Cancelar</button>`:`<button class="btn sm" data-act="focus">Empezar 25 min</button>`}</div></div><p class="small muted">El tiempo sigue corriendo aunque cierres la app; al volver, se contará el bloque. Al terminar, toca una pausa de 5 minutos.</p></section>`;
  if(S.breakEnd&&Date.now()<S.breakEnd) h+=`<section class="card tint-mint"><div class="focus"><div class="clock num" data-live="break">${fmtClock(S.breakEnd-Date.now())}</div><div style="display:grid;gap:4px"><b>Pausa con ${esc(S.name)}</b><span class="small">Levántate, bebe agua y mira algo lejano.</span><button class="link-btn" data-act="breakstop" style="justify-self:start">Terminar pausa</button></div></div></section>`;
  const active=S.goals.filter(g=>!g.done), done=S.goals.filter(g=>g.done);
  h+=`<section class="card"><div class="card-head"><h2>Objetivos</h2><span class="badge">${done.length} ${done.length===1?"logro":"logros"}</span></div><p class="small muted">Divide cada objetivo en hitos. Cada hito suma brillo para que ${esc(S.name)} evolucione.</p>`;
  active.forEach(g=>{ h+=goalBlock(g); });
  h+=`<div class="row"><input class="field grow" type="text" id="new-goal" placeholder="Nuevo objetivo" aria-label="Nuevo objetivo"><button class="btn sm" data-act="addgoal">Añadir</button></div>`;
  if(done.length) h+=`<div class="sub-sec"><h3>Conseguidos</h3>${done.slice(-8).reverse().map(g=>`<div class="row"><span class="badge">Logro</span><span class="grow">${esc(g.t)}</span><button class="link-btn" data-act="goalundo" data-v="${g.id}">Reabrir</button></div>`).join("")}</div>`;
  h+=`</section>`;
  return h+closeCard(d);
}
function closeCard(d){
  if(d.close) return `<section class="card tint-butter"><h2>Jornada cerrada</h2><p class="small">Mañana empiezas por: <b>${esc(d.close.next||"lo que elijas")}</b>. Buen trabajo hoy.</p><button class="link-btn" data-act="reopen" style="justify-self:start">Reabrir</button></section>`;
  const dn=(d.top||[]).filter(x=>x.done&&x.t);
  return `<section class="card"><h2>Cerrar la jornada</h2>${dn.length?`<p class="small">Hoy has completado: ${dn.map(x=>esc(x.t)).join(" · ")}</p>`:`<p class="small">Cerrar el día también cuenta, aunque haya sido raro.</p>`}<label class="small" for="close-next" style="font-weight:800">Primera tarea de mañana</label><input class="field" type="text" id="close-next" placeholder="Mañana arrancas sin pensar"><button class="btn" data-act="closeday">Cerrar jornada</button></section>`;
}
function goalBlock(g){
  const st=g.steps||[], dn=st.filter(s=>s.done).length, p=st.length?dn/st.length:0;
  return `<div class="goal"><div class="goal-head"><b>${esc(g.t)}</b><button class="icon-btn" data-act="goaldel" data-v="${g.id}" aria-label="Eliminar objetivo">×</button></div><div class="progress"><i style="width:${Math.round(p*100)}%;background:var(--night)"></i></div><span class="small muted">${dn} de ${st.length} hitos</span>${st.map(s=>`<button class="ms ${s.done?"done":""}" data-act="ms" data-g="${g.id}" data-v="${s.id}" aria-pressed="${!!s.done}"><span class="box"></span><span>${esc(s.t)}</span></button>`).join("")}<div class="row"><input class="field grow" type="text" id="ms-${g.id}" placeholder="Añadir hito" aria-label="Añadir hito a ${esc(g.t)}" style="padding:8px 12px"><button class="btn soft sm" data-act="addms" data-v="${g.id}" aria-label="Añadir hito">+</button></div>${st.length&&dn===st.length?`<button class="btn sm" data-act="goaldone" data-v="${g.id}">¡Objetivo conseguido!</button>`:""}</div>`;

function metricsCard(){
  const tk=todayKey(), mon=mondayOf(tk), R=S.reminders;
  let act=0, rc=0; for(let i=0;i<7;i++){ const d=days["d-"+addDays(mon,i)]; if(isActive(d)) act++; if(d){ if(mFull(d)) rc++; if(nFull(d)) rc++; } }
  const keys=Object.keys(days).filter(k=>isActive(days[k])).map(k=>k.slice(2)).sort(), first=keys[0];
  const cons=n=>{ if(!first) return "sin datos"; const t=addDays(first,n); if(t>tk) return "pendiente"; return keys.some(k=>k>=t)?"sí":"no"; };
  let tot=0, before=0;
  for(let i=1;i<=14;i++){ const d=days["d-"+addDays(tk,-i)]; if(!d) continue;
    if(d.mAt!=null){ tot++; if(!R.morning.on||d.mAt<toMin(R.morning.time)) before++; }
    if(d.nAt!=null){ tot++; if(!R.night.on||d.nAt<toMin(R.night.time)) before++; } }
  let dis=0; for(let i=0;i<7;i++){ const d=days["d-"+addDays(tk,-i)]; if(d) dis+=(d.dismissed||[]).length; }
  const rows=[["Días activos esta semana",`${act}/7`],["Rutinas completas esta semana",`${rc}`],["Sigues usándola a los 7 días",cons(7)],["A los 30 días",cons(30)],["A los 60 días",cons(60)],["Rutinas hechas antes del aviso (14 días)",tot?`${Math.round(before/tot*100)} %`:"sin datos"],["Avisos aplazados (7 días)",`${dis}`]];
  return `<section class="card"><h2>Tu constancia</h2><p class="small muted">Solo tú ves estos datos. Si sube el porcentaje de rutinas hechas antes del aviso, el hábito se está automatizando.</p><div class="metrics">${rows.map(([l,v])=>`<div><span>${l}</span><b class="num">${v}</b></div>`).join("")}</div></section>`;
}

  $("#app").innerHTML=(tab==="hoy"?viewHoy():tab==="work"?viewWork():tab==="pet"?viewPet():tab==="prog"?viewProg():viewSet())+`<p class="foot">${mode==="db"?"Guardado en tu cuenta":"Guardado solo en este iPhone · haz copias en Ajustes"}</p>`;
  $("#tabs").innerHTML=TABS.map(([id,l])=>`<button data-tab="${id}" ${tab===id?'aria-current="page"':""}>${ICONS[id]}<span>${esc(l||S.name)}</span></button>`).join("");
  window.scrollTo(0,sy);
}
function safeRender(){ const a=document.activeElement; if($("#modal").innerHTML) return; if(!(a&&(a.tagName==="INPUT"||a.tagName==="SELECT"))) render(); }

/* ===== MODALES ===== */
function openModal(html){ $("#modal").innerHTML=`<div class="modal" data-act="closebg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; const b=$("#modal .sheet button"); if(b) b.focus(); }
function closeModal(){ $("#modal").innerHTML=""; }
function discHTML(pl,isNew){
  return `<div class="eyebrow">${isNew?`${esc(S.name)} ha viajado a…`:"Descubrimiento"}</div><h2>${esc(pl.place)}</h2><span class="cat" style="background:${CATS[pl.cat].c};border-radius:999px;padding:3px 10px;justify-self:start">${CATS[pl.cat].t}</span><div class="card" style="background:${CATS[pl.cat].c};box-shadow:none"><h3>${esc(pl.t)}</h3><p>${esc(pl.x)}</p></div><div><div class="eyebrow">Prueba hoy</div><p>${esc(pl.try)}</p></div><p class="small muted">Contenido divulgativo general.</p>${!day().challenge?`<button class="btn soft" data-act="chaccept" data-v="${pl.id}">Aceptar como reto de hoy (+2 gotas)</button>`:""}<button class="btn" data-act="close">${isNew?"¡Guardar en el libro!":"Cerrar"}</button>`;
}
function photoGuide(){
  openModal(`<h2>Antes de la foto</h2><ul class="tips"><li>Misma luz que la última vez; mejor luz natural de frente.</li><li>Mismo ángulo y distancia.</li><li>Sin filtros ni retoques: la app no los ofrece a propósito.</li><li>Una foto cada 4 semanas basta para ver la evolución.</li></ul><div class="row"><button class="btn grow" data-act="photocam">Hacer foto</button><button class="btn soft grow" data-act="photogal">De la galería</button></div><button class="link-btn" data-act="close" style="justify-self:center">Cancelar</button>`);
}
function anchorModal(k){
  openModal(`<div class="eyebrow">Ancla de la rutina de ${k==="morning"?"mañana":"noche"}</div><h2>¿Después de qué la haces?</h2><p class="small">Unir la rutina a algo que ya haces cada día ayuda a que salga sola.</p><div class="chips">${ANCHOR_OPTS[k].map(a=>`<button class="chip ${S.anchors[k]===a?"on":""}" data-act="anchorpick" data-k="${k}" data-v="${esc(a)}">${esc(a)}</button>`).join("")}</div><label class="small" for="anc-custom" style="font-weight:800">U otra cosa</label><input class="field" id="anc-custom" type="text" value="${esc(ANCHOR_OPTS[k].includes(S.anchors[k])?"":S.anchors[k])}" placeholder="Escribe tu momento"><button class="btn" data-act="anchorsave" data-k="${k}">Guardar ancla</button>`);
}
function showOnboarding(){
  const pick=(arr,def)=>{ const ids=arr.map(s=>s.id), d=def.filter(x=>ids.includes(x)); return new Set(d.length?d:ids); };
  ob={step:1,m:pick(S.morning,["m1","m4","m5"]),n:pick(S.night,["n2","n5"]),am:S.anchors.morning||"",an:S.anchors.night||"",name:S.name};
  obRender();
}
function obRender(){
  let h="";
  if(ob.step===1) h=`<div class="stage-hero"><div style="width:130px;height:130px">${petSVG({stage:S.stage||0,mood:"happy"})}</div><div class="eyebrow">Paso 1 de 3</div><h2>¡Hola! Soy tu gotita de rocío</h2><p>Crezco cuando te cuidas. ¿Cómo quieres llamarme?</p></div><input class="field" id="ob-name" value="${esc(ob.name)}" maxlength="20" aria-label="Nombre de la mascota"><button class="btn" data-act="ob-next">Siguiente</button>`;
  else if(ob.step===2) h=`<div class="eyebrow">Paso 2 de 3</div><h2>Empieza con lo esencial</h2><p class="small">Las primeras repeticiones son las que más hábito crean. Elige 2 o 3 pasos por rutina; podrás añadir más cuando quieras.</p><div class="ob-list"><h3>Mañana</h3><div class="chips">${S.morning.map(s=>`<button class="chip ${ob.m.has(s.id)?"on":""}" data-act="ob-pick" data-k="m" data-v="${s.id}" aria-pressed="${ob.m.has(s.id)}">${esc(s.t)}</button>`).join("")}</div><h3>Noche</h3><div class="chips">${S.night.map(s=>`<button class="chip ${ob.n.has(s.id)?"on":""}" data-act="ob-pick" data-k="n" data-v="${s.id}" aria-pressed="${ob.n.has(s.id)}">${esc(s.t)}</button>`).join("")}</div></div><div class="row"><button class="btn soft grow" data-act="ob-back">Atrás</button><button class="btn grow" data-act="ob-next">Siguiente</button></div>`;
  else h=`<div class="eyebrow">Paso 3 de 3</div><h2>¿En qué momento?</h2><p class="small">Une cada rutina a algo que ya haces. Funciona mejor que depender de un aviso.</p><h3>Mañana, después de…</h3><div class="chips">${ANCHOR_OPTS.morning.map(a=>`<button class="chip ${ob.am===a?"on":""}" data-act="ob-anchor" data-k="am" data-v="${esc(a)}">${esc(a)}</button>`).join("")}</div><input class="field" id="ob-am" type="text" value="${esc(ANCHOR_OPTS.morning.includes(ob.am)?"":ob.am)}" placeholder="U otro momento" aria-label="Otro momento para la rutina de mañana"><h3>Noche, después de…</h3><div class="chips">${ANCHOR_OPTS.night.map(a=>`<button class="chip ${ob.an===a?"on":""}" data-act="ob-anchor" data-k="an" data-v="${esc(a)}">${esc(a)}</button>`).join("")}</div><input class="field" id="ob-an" type="text" value="${esc(ANCHOR_OPTS.night.includes(ob.an)?"":ob.an)}" placeholder="U otro momento" aria-label="Otro momento para la rutina de noche"><div class="row"><button class="btn soft grow" data-act="ob-back">Atrás</button><button class="btn grow" data-act="ob-finish">¡Empezamos!</button></div>`;
  openModal(h);
}
function showEvolution(st){
  openModal(`<div class="stage-hero"><div class="eyebrow">¡Evolución!</div><div style="width:180px;height:180px">${petSVG({stage:st,mood:"happy"})}</div><h2>${esc(S.name)} es ahora ${esc(STAGES[st].n)}</h2><p>${esc(STAGES[st].d)}</p></div><button class="btn" data-act="close">¡Qué bonita!</button>`);
}
function confirmModal(text,act,v){ openModal(`<h2>${esc(text)}</h2><div class="row"><button class="btn soft grow" data-act="close">Cancelar</button><button class="btn grow" data-act="${act}" data-v="${esc(v)}">Eliminar</button></div>`); }

/* ===== FOTOS ===== */
function loadImg(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file), im=new Image(); im.onload=()=>{ res(im); setTimeout(()=>URL.revokeObjectURL(u),1000); }; im.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error("img")); }; im.src=u; }); }
function toJpeg(im,max,q){ const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)), c=document.createElement("canvas"); c.width=Math.round(im.naturalWidth*s); c.height=Math.round(im.naturalHeight*s); c.getContext("2d").drawImage(im,0,0,c.width,c.height); return c.toDataURL("image/jpeg",q); }
async function handleFile(file){
  if(!file) return;
  try{
    const im=await loadImg(file);
    const full=toJpeg(im,1400,.82);
    photoTarget={full,thumb:toJpeg(im,260,.7)};
    openModal(`<h2>Nueva foto</h2><img src="${photoTarget.thumb}" alt="Vista previa"><label class="small" for="ph-note" style="font-weight:800">Nota (opcional)</label><input class="field" id="ph-note" type="text" placeholder="Producto nuevo, cómo notas la piel…"><div class="chips" id="ph-tags">${PHOTO_TAGS.map((t,i)=>`<button class="chip ${i===0?"on":""}" data-act="phtag" data-v="${t}">${t}</button>`).join("")}</div><div class="row"><button class="btn soft grow" data-act="close">Descartar</button><button class="btn grow" data-act="savephoto">Guardar en el álbum</button></div>`);
  }catch(e){ toast("No se ha podido leer la imagen. Prueba con otra foto."); }
}
async function savePhoto(){
  if(!photoTarget) return;
  const id=uid(), key="ph-"+id, noteEl=$("#ph-note"), tagEl=document.querySelector("#ph-tags .chip.on");
  const meta={key,kind:"photo",date:todayKey(),ts:Date.now(),note:noteEl?noteEl.value:"",tag:tagEl?tagEl.dataset.v:"",thumb:photoTarget.thumb};
  const full=photoTarget.full; photoTarget=null; closeModal();
  try{ await IDB.put("full",full,key); await IDB.put("meta",meta); photos[key]=meta; render(); toast("Foto guardada en el álbum."); firstTime("photo","¡Primera foto del álbum!"); }
  catch(e){ render(); toast("No hay espacio para guardar la foto. Haz una copia de seguridad y borra alguna antigua."); }
}
async function viewPhoto(key){
  const p=photos[key]; if(!p) return;
  openModal(`<div class="eyebrow">${esc(fmtDate(p.date))} · ${esc(fmtTime(p.ts))}${p.tag?` · ${esc(p.tag)}`:""}</div><img id="ph-full" src="${p.thumb}" alt="Foto del ${esc(fmtDate(p.date))}">${p.note?`<p>${esc(p.note)}</p>`:""}<div class="row"><button class="btn soft grow" data-act="askdelphoto" data-v="${key}">Eliminar</button><button class="btn grow" data-act="close">Cerrar</button></div>`);
  try{ const img=await IDB.get("full",key); const el=$("#ph-full"); if(el&&img) el.src=img; }catch(e){}
}
async function deletePhoto(key){
  delete photos[key]; closeModal(); render();
  try{ await IDB.del("meta",key); await IDB.del("full",key); toast("Foto eliminada."); }catch(e){ toast("No se ha podido eliminar del todo. Inténtalo de nuevo."); }
}
$("#cam").addEventListener("change",e=>{ handleFile(e.target.files[0]); e.target.value=""; });
$("#gal").addEventListener("change",e=>{ handleFile(e.target.files[0]); e.target.value=""; });

/* ===== INTERACCIÓN ===== */
function hearts(btn){
  btn.classList.remove("squish"); void btn.offsetWidth; btn.classList.add("squish");
  for(let i=0;i<3;i++){ const s=document.createElement("span"); s.className="heart"; s.textContent="♥"; s.style.setProperty("--dx",(i-1)*24+"px"); s.style.animationDelay=(i*.12)+"s"; btn.appendChild(s); setTimeout(()=>s.remove(),1600); }
  const ph=["¡Gracias por cuidarme!","Me encanta que vengas.","¡Hoy brillamos juntas!","Mmm, qué gustito.","¿Un vaso de agua después?"];
  const b=document.querySelector(".bubble"); if(b) b.textContent=ph[Math.floor(Math.random()*ph.length)];
}
function startTrip(){
  const d=day(); if(d.adventured||S.trip) return;
  const seen=new Set(S.found.map(f=>f.id)); let pool=PLACES.filter(p=>!seen.has(p.id)); if(!pool.length) pool=PLACES;
  const pl=pool[Math.floor(Math.random()*pool.length)], now=Date.now();
  S.trip={place:pl.id,start:now,end:now+TRIP_HOURS*3600e3}; d.adventured=true;
  saveDay(); saveState(); render(); toast(`${S.name} se ha ido de aventura. Vuelve a las ${fmtTime(S.trip.end)}.`);
}
function revealTrip(){
  if(!S.trip||Date.now()<S.trip.end) return;
  const pl=PLACES.find(p=>p.id===S.trip.place)||PLACES[0];
  if(!S.found.some(f=>f.id===pl.id)) S.found.push({id:pl.id,date:todayKey()});
  S.trip=null; saveState(); openModal(discHTML(pl,true));
  if(catComplete(pl.cat)&&!S.flags["cat-"+pl.cat]){ S.flags["cat-"+pl.cat]=true; saveState(); setTimeout(()=>toast(`¡Región ${CATS[pl.cat].t} completa! Nuevo decorado en el hábitat.`),400); }
  firstTime("trip","¡Primera aventura completada!");
}

document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-tab]");
  if(t){ tab=t.dataset.tab; render(); window.scrollTo(0,0); return; }
  const b=ev.target.closest("[data-act]"); if(!b||b.disabled) return;
  const a=b.dataset.act, v=b.dataset.v, d=day();
  if(a==="closebg"){ if(ev.target===b){ closeModal(); render(); checkEvolution(); } return; }
  const before=energy(), g=goalOf(d);
  switch(a){
    case "close": closeModal(); render(); checkEvolution(); return;
    case "pet": hearts(b); return;
    case "mood": d.mood=Number(v); saveDay(); break;
    case "sec": section=v; render(); { const p=document.querySelector(".segs"); if(p) p.scrollIntoView({block:"start",behavior:"smooth"}); } return;
    case "step": { const o=b.dataset.k==="m"?d.m:d.n; if(o[v]) delete o[v]; else o[v]=true; saveDay(); break; }
    case "all": { const k=b.dataset.k, arr=k==="m"?S.morning:S.night, o=k==="m"?d.m:d.n, full=arr.every(s=>o[s.id]); arr.forEach(s=>{ if(full) delete o[s.id]; else o[s.id]=true; }); saveDay(); break; }
    case "skin": d.skin=d.skin.includes(v)?d.skin.filter(x=>x!==v):d.skin.concat(v); saveDay(); break;
    case "meal": { const m=d.meals[v]||(d.meals[v]={done:false,note:"",tags:[]}); m.done=!m.done; saveDay(); break; }
    case "open": { openMeals.has(v)?openMeals.delete(v):openMeals.add(v); render(); const el=document.getElementById("meal-"+v.replace(/\W/g,"")); if(el) el.focus(); return; }
    case "ftag": { const m=d.meals[b.dataset.m]||(d.meals[b.dataset.m]={done:false,note:"",tags:[]}); m.tags=(m.tags||[]).includes(v)?m.tags.filter(x=>x!==v):(m.tags||[]).concat(v); saveDay(); break; }
    case "water": { const n=Number(v); d.water=(d.water===n&&b.classList.contains("glass"))?n-1:n; saveDay(); break; }
    case "dismiss": d.dismissed=(d.dismissed||[]).concat(v); saveDay(); break;
    case "goset": tab="set"; render(); window.scrollTo(0,0); return;
    case "trip": startTrip(); return;
    case "reveal": revealTrip(); return;
    case "disc": openModal(discHTML(PLACES.find(p=>p.id===v),false)); return;
    case "photo": photoGuide(); return;
    case "photocam": closeModal(); $("#cam").click(); return;
    case "photogal": closeModal(); $("#gal").click(); return;
    case "flag": S.flags[v]=true; saveState(); break;
    case "adjust": S.weekFocus={week:mondayOf(todayKey()),t:v}; S.flags["rev-"+mondayOf(todayKey())]=true; saveState(); toast("Ajuste guardado para esta semana."); break;
    case "remretire": S.reminders.morning.on=false; S.reminders.night.on=false; S.flags.remRetire=true; saveState(); toast("Avisos de rutina desactivados. Tus anclas toman el relevo."); break;
    case "chaccept": d.challenge={id:v,done:false}; saveDay(); closeModal(); toast("Reto aceptado. Lo tienes en Hoy."); break;
    case "chdone": if(d.challenge){ d.challenge.done=true; saveDay(); } break;
    case "chdrop": d.challenge=null; saveDay(); break;
    case "anchor": anchorModal(v); return;
    case "anchorpick": S.anchors[b.dataset.k]=v; saveState(); closeModal(); break;
    case "anchorsave": { const el=$("#anc-custom"), tx=el&&el.value.trim(); if(tx){ S.anchors[b.dataset.k]=tx; saveState(); } closeModal(); break; }
    case "onboard": showOnboarding(); return;
    case "ob-next": { if(ob.step===1){ const el=$("#ob-name"); ob.name=(el&&el.value.trim())||"Rocío"; } if(ob.step===2&&(!ob.m.size||!ob.n.size)){ toast("Elige al menos un paso por rutina."); return; } ob.step++; obRender(); return; }
    case "ob-back": ob.step=Math.max(1,ob.step-1); obRender(); return;
    case "ob-pick": { const set=b.dataset.k==="m"?ob.m:ob.n; set.has(v)?set.delete(v):set.add(v); obRender(); return; }
    case "ob-anchor": { const am=$("#ob-am"), an=$("#ob-an"); ob[b.dataset.k]=v; if(am&&b.dataset.k!=="am"&&am.value.trim()) ob.am=am.value.trim(); if(an&&b.dataset.k!=="an"&&an.value.trim()) ob.an=an.value.trim(); obRender(); return; }
    case "ob-finish": { const am=$("#ob-am"), an=$("#ob-an"); if(am&&am.value.trim()) ob.am=am.value.trim(); if(an&&an.value.trim()) ob.an=an.value.trim();
      S.name=ob.name; S.morning=S.morning.filter(s=>ob.m.has(s.id)); S.night=S.night.filter(s=>ob.n.has(s.id)); S.anchors={morning:ob.am,night:ob.an}; S.onboarded=true; if(!S.startDate) S.startDate=todayKey(); saveState(); closeModal(); ob=null; render(); toast("¡Todo listo! Esta semana bastan 4 gotas al día."); return; }
    case "closeday": { const el=$("#close-next"); d.close={next:el?el.value.trim():"",at:Date.now()}; saveDay(); toast("Jornada cerrada. ¡A descansar!"); break; }
    case "reopen": d.close=null; saveDay(); break;
    case "breakstop": S.breakEnd=null; saveState(); break;
    case "backup": doBackup(); return;
    case "restore": $("#restore-file").click(); return;
    case "dorestore": doRestore(); return;
    case "phtag": document.querySelectorAll("#ph-tags .chip").forEach(c=>c.classList.toggle("on",c===b)); return;
    case "savephoto": savePhoto(); return;
    case "viewphoto": viewPhoto(v); return;
    case "askdelphoto": confirmModal("¿Eliminar esta foto del álbum?","delphoto",v); return;
    case "delphoto": deletePhoto(v); return;
    case "compare": compareOpen=!compareOpen; break;
    case "topdone": { const x=(d.top||[]).find(z=>z.id===v); if(x&&x.t){ x.done=!x.done; saveDay(); } break; }
    case "focus": S.focusEnd=Date.now()+25*60e3; saveState(); toast("Bloque de 25 minutos en marcha."); break;
    case "focusstop": S.focusEnd=null; saveState(); break;
    case "addgoal": { const el=$("#new-goal"), tx=el&&el.value.trim(); if(!tx){ if(el) el.focus(); return; } S.goals.push({id:uid(),t:tx,steps:[],done:false,created:todayKey()}); saveState(); break; }
    case "addms": { const el=document.getElementById("ms-"+v), go=S.goals.find(x=>x.id===v), tx=el&&el.value.trim(); if(!go||!tx){ if(el) el.focus(); return; } go.steps.push({id:uid(),t:tx,done:false}); saveState(); render(); const n=document.getElementById("ms-"+v); if(n) n.focus(); return; }
    case "ms": { const go=S.goals.find(x=>x.id===b.dataset.g), s=go&&go.steps.find(x=>x.id===v); if(s){ s.done=!s.done; saveState(); } break; }
    case "goaldone": { const go=S.goals.find(x=>x.id===v); if(go){ go.done=true; go.doneDate=todayKey(); saveState(); toast(`¡Logro desbloqueado! ${S.name} suma +5 de brillo.`); firstTime("goal","¡Primer objetivo de trabajo conseguido!"); } break; }
    case "goalundo": { const go=S.goals.find(x=>x.id===v); if(go){ go.done=false; saveState(); } break; }
    case "goaldel": confirmModal("¿Eliminar este objetivo y sus hitos?","goaldel2",v); return;
    case "goaldel2": S.goals=S.goals.filter(x=>x.id!==v); saveState(); closeModal(); break;
    case "rem": S.reminders[v].on=!S.reminders[v].on; saveState(); break;
    case "add": { const k=b.dataset.k, s={id:k[0]+uid(),t:"Nuevo paso"}; S[k].push(s); saveState(); render(); const el=document.getElementById(`e-${k}-${s.id}`); if(el){ el.focus(); el.select(); } return; }
    case "del": S[b.dataset.k]=S[b.dataset.k].filter(s=>s.id!==v); saveState(); break;
    case "up": { const k=b.dataset.k, i=S[k].findIndex(s=>s.id===v); if(i>0){ const x=S[k][i-1]; S[k][i-1]=S[k][i]; S[k][i]=x; saveState(); } break; }
    default: return;
  }
  { const pre=d.mAt+"|"+d.nAt;
    if(mFull(d)){ if(d.mAt==null) d.mAt=nowMin(); } else delete d.mAt;
    if(nFull(d)){ if(d.nAt==null) d.nAt=nowMin(); } else delete d.nAt;
    if(pre!==d.mAt+"|"+d.nAt) saveDay();
    if(mFull(d)||nFull(d)) firstTime("routine",`¡Primera rutina completa! ${S.name} está orgullosa.`);
    if((d.water||0)>=8) firstTime("water","¡Primer día con los 8 vasos de agua!"); }
  render();
  if(d.mood!=null&&before<g&&energy()>=g&&!d.adventured&&!S.trip) toast(`¡${S.name} ya puede irse de aventura!`);
  checkEvolution();
});
document.addEventListener("input",ev=>{
  const el=ev.target, d=day();
  if(el.dataset.note!=null){ const n=el.dataset.note, m=d.meals[n]||(d.meals[n]={done:false,note:"",tags:[]}); m.note=el.value; saveDay(); }
  else if(el.dataset.topwhen){ const x=(d.top||[]).find(z=>z.id===el.dataset.topwhen); if(x){ x.when=el.value; saveDay(); } }
  else if(el.dataset.anchor){ S.anchors[el.dataset.anchor]=el.value; saveState(); }
  else if(el.dataset.top){ const x=(d.top||[]).find(z=>z.id===el.dataset.top); if(x){ x.t=el.value; if(!x.t.trim()) x.done=false; saveDay(); } }
  else if(el.dataset.edit==="name"){ S.name=el.value.trim()||"Rocío"; saveState(); }
  else if(el.dataset.edit){ const s=S[el.dataset.edit].find(x=>x.id===el.dataset.v); if(s){ s.t=el.value; saveState(); } }
});
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.dataset.edit==="name"||el.dataset.top) render();
  else if(el.dataset.rem&&el.value){ const [k,f]=el.dataset.rem.split("."); S.reminders[k][f]=f==="every"?Number(el.value):el.value; saveState(); toast("Recordatorio actualizado."); }
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape"&&$("#modal").innerHTML){ closeModal(); render(); return; }
  if(ev.key!=="Enter"||!ev.target.id) return;
  if(ev.target.id==="new-goal"){ const b=document.querySelector('[data-act="addgoal"]'); if(b) b.click(); }
  else if(ev.target.id.startsWith("ms-")){ const b=document.querySelector(`[data-act="addms"][data-v="${ev.target.id.slice(3)}"]`); if(b) b.click(); }
});

/* Reloj: enfoque, aventura y avisos */
let lastTick=Date.now();
setInterval(()=>{
  const now=Date.now();
  if(S.focusEnd&&now>=S.focusEnd){ S.focusEnd=null; S.breakEnd=now+5*60e3; const d=day(); d.focus=(d.focus||0)+1; saveDay(); saveState(); toast(`¡Bloque completado! +1 gota. Ahora, 5 minutos de pausa.`); firstTime("focus","¡Primer bloque de enfoque!"); safeRender(); checkEvolution(); }
  if(S.breakEnd&&now>=S.breakEnd){ S.breakEnd=null; saveState(); toast("Fin de la pausa. ¿Otro bloque?"); safeRender(); }
  const bk=document.querySelector('[data-live="break"]'); if(bk&&S.breakEnd) bk.textContent=fmtClock(S.breakEnd-now);
  const f=document.querySelector('[data-live="focus"]'); if(f&&S.focusEnd) f.textContent=fmtClock(S.focusEnd-now);
  const tr=document.querySelector('[data-live="trip"]'); if(tr&&S.trip){ if(now>=S.trip.end) safeRender(); else tr.textContent=fmtDur(S.trip.end-now); }
  if(now-lastTick>60e3){ lastTick=now; if(tab==="hoy"){ const k=reminderState().due.map(x=>x.id).join("|"); if(k!==lastDueKey) safeRender(); } }
},1000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) safeRender(); });

/* ===== ARRANQUE ===== */
render(); checkEvolution();
let pendingRestore=null;
async function doBackup(){
  try{
    const metas=await IDB.all("meta"), fulls={};
    for(const m of metas){ fulls[m.key]=await IDB.get("full",m.key); }
    const data={app:"rocio-ritual",version:1,exported:new Date().toISOString(),state:S,days,photos:metas,photoFull:fulls};
    const blob=new Blob([JSON.stringify(data)],{type:"application/json"}), name=`rocio-copia-${todayKey()}.json`;
    const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"Copia de Rocío Ritual"}); }
    else { const u=URL.createObjectURL(blob), a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),5000); }
    S.lastBackup=todayKey(); saveState(); render(); toast("Copia lista. Guárdala en Archivos o iCloud.");
  }catch(e){ if(e&&e.name==="AbortError") return; toast("No se ha podido crear la copia. Inténtalo de nuevo."); }
}
$("#restore-file").addEventListener("change",async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{ const data=JSON.parse(await f.text()); if(data.app!=="rocio-ritual"||!data.state) throw new Error("x");
    pendingRestore=data;
    openModal(`<h2>¿Restaurar esta copia?</h2><p class="small">Copia del ${esc(fmtDate(String(data.exported).slice(0,10)))} con ${Object.keys(data.days||{}).length} días y ${(data.photos||[]).length} fotos. Sustituirá todo lo que hay ahora en la app.</p><div class="row"><button class="btn soft grow" data-act="close">Cancelar</button><button class="btn grow" data-act="dorestore">Restaurar</button></div>`);
  }catch(err){ toast("Ese archivo no es una copia de Rocío Ritual."); }
});
async function doRestore(){
  const data=pendingRestore; pendingRestore=null; if(!data) return;
  try{
    LS.keys("d-").forEach(k=>LS.del(k));
    LS.set("state",data.state); Object.entries(data.days||{}).forEach(([k,v])=>LS.set(k,v));
    await IDB.clear("meta"); await IDB.clear("full");
    for(const m of (data.photos||[])){ await IDB.put("meta",m); if(data.photoFull&&data.photoFull[m.key]) await IDB.put("full",data.photoFull[m.key],m.key); }
    location.reload();
  }catch(e){ closeModal(); toast("No se ha podido restaurar la copia."); }
}
(async function initLocal(){
  try{ if(navigator.storage&&navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
  try{ (await IDB.all("meta")).forEach(p=>{ photos[p.key]=p; }); }catch(e){}
  safeRender(); checkEvolution();
  if(!S.onboarded&&!$("#modal").innerHTML) showOnboarding();
})();
if("serviceWorker" in navigator) window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
})();
</script>
